<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>自転車ナビ | 周辺視野矢印 v2.1</title>

  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="自転車ナビ" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css?v=2.0" />
  <link rel="stylesheet" href="arrow-colors.css?v=2.1" />
</head>

<body>
  <main id="app">
    <section class="map-section" aria-label="地図">
      <div id="map"></div>
    </section>
    <section class="status-card" aria-live="polite">
      <div><strong>状態:</strong> <span id="status">現在地を取得しています...</span></div>
      <div><strong>現在地:</strong> <span id="currentLocation">取得中...</span></div>
      <div><strong>GPS精度:</strong> <span id="accuracy">-</span></div>
      <div><strong>走行判定:</strong> <span id="motionState">停止中</span></div>
      <div><strong>速度:</strong> <span id="speedText">-</span></div>
      <div><strong>方位:</strong> <span id="headingState">未取得</span></div>
      <div><strong>目的地:</strong> <span id="destination">未指定</span></div>
      <div><strong>距離:</strong> <span id="distance">-</span></div>
      <div><strong>所要時間:</strong> <span id="duration">-</span></div>
    </section>
    <div class="compass-row"><button id="compassButton" type="button">🧭 方位センサーを有効にする</button></div>

    <!-- 矢印色は走行開始前（地図画面）に選択する -->
    <section class="arrow-color-settings" aria-label="案内矢印の色の設定">
      <span class="arrow-color-title">案内矢印の色</span>
      <div class="arrow-color-buttons" role="group" aria-label="案内矢印の色">
        <button type="button" class="arrow-color-button" data-arrow-color="black" aria-pressed="true">
          <span class="arrow-color-swatch arrow-color-swatch--black" aria-hidden="true"></span>黒
        </button>
        <button type="button" class="arrow-color-button" data-arrow-color="blue" aria-pressed="false">
          <span class="arrow-color-swatch arrow-color-swatch--blue" aria-hidden="true"></span>青
        </button>
      </div>
    </section>

    <p class="hint">
      地図上をタップして目的地を設定してください。
      現在地は自動で継続更新します。
    </p>

    <div class="bottom-spacer" aria-hidden="true"></div>
    <nav class="controls" aria-label="ナビ操作">
      <button id="locationButton" type="button">現在地</button>
      <button id="routeButton" type="button" disabled>自転車ルート</button>
      <button id="followButton" type="button">追従：ON</button>
      <button id="appleMapsButton" type="button" disabled>Apple Maps</button>
      <button id="clearButton" type="button">クリア</button>
    </nav>
    <!-- 走行中だけ現れる、端末の上端を基準とする巨大な色選択式矢印 -->
    <div id="arrowOverlay" class="arrow-overlay" aria-hidden="true">
      <div class="arrow-body">
        <svg id="arrowSymbol" class="nav-arrow" viewBox="0 0 200 200" role="img" aria-label="案内の矢印">
          <path d="M100 8 L193 102 H133 V192 H67 V102 H7 Z" />
        </svg>
        <div id="arrowWaiting" class="arrow-waiting" hidden>方位を取得中</div>
      </div>
      <div class="arrow-foot" id="arrowFoot">端末上端の向きを基準に案内</div>
    </div>
    <div id="goalOverlay" class="goal-overlay" aria-live="assertive" aria-hidden="true">
      <div class="goal-card">
        <div class="goal-icon">🎉</div>
        <div class="goal-title">ゴール！</div>
        <div class="goal-subtitle">目的地に到着しました</div>
      </div>
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    </div>
    <div class="rotate-overlay" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-icon">↻</div>
        <div class="rotate-title">縦向きにしてください</div>
        <div class="rotate-text">このナビは縦向き専用です。</div>
      </div>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="nav-core.js?v=2.0"></script>
  <script src="app.js?v=2.0"></script>
  <script src="arrow-colors.js?v=2.1"></script>
</body>
</html>
