<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>かんたんルートナビ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>かんたんルートナビ</h1>
    <p>現在地を取得し、地図をタップして目的地を指定します。</p>
  </header>

  <main>
    <section class="controls">
      <button id="locationButton">① 現在地を再取得</button>
      <button id="routeButton" disabled>② 自転車ルートを検索</button>
      <button id="appleMapsButton" disabled>③ Apple Mapsで案内</button>
      <button id="followButton">現在地を追従：ON</button>
      <button id="clearButton">クリア</button>
    </section>

    <section class="status-card">
      <div><strong>状態:</strong> <span id="status">現在地を取得しています...</span></div>
      <div><strong>現在地:</strong> <span id="currentLocation">取得中...</span></div>
      <div><strong>GPS精度:</strong> <span id="accuracy">-</span></div>
      <div><strong>目的地:</strong> <span id="destination">未指定</span></div>
      <div><strong>距離:</strong> <span id="distance">-</span></div>
      <div><strong>所要時間:</strong> <span id="duration">-</span></div>
    </section>

    <div id="map"></div>

    <p class="hint">
      現在地は自動で継続更新します。地図上の目的地をタップしてください。
    </p>

    <div id="goalOverlay" class="goal-overlay" aria-live="assertive" aria-hidden="true">
      <div class="goal-message">
        <div class="goal-burst">🎉</div>
        <div class="goal-title">ゴール！</div>
        <div class="goal-subtitle">目的地に到着しました</div>
      </div>
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    </div>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
