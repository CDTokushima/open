<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>かんたん自転車ナビ</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <section class="map-section">
      <div id="map"></div>
    </section>

    <section class="status-card">
      <div><strong>状態:</strong> <span id="status">現在地を取得しています...</span></div>
      <div><strong>現在地:</strong> <span id="currentLocation">取得中...</span></div>
      <div><strong>GPS精度:</strong> <span id="accuracy">-</span></div>
      <div><strong>目的地:</strong> <span id="destination">未指定</span></div>
      <div><strong>距離:</strong> <span id="distance">-</span></div>
      <div><strong>所要時間:</strong> <span id="duration">-</span></div>
    </section>

    <p class="hint">
      地図上の目的地をタップしてください。現在地は自動で継続更新します。
    </p>

    <div class="bottom-spacer" aria-hidden="true"></div>

    <nav class="controls" aria-label="ナビ操作">
      <button id="locationButton" type="button">現在地</button>
      <button id="routeButton" type="button" disabled>自転車ルート</button>
      <button id="followButton" type="button">追従：ON</button>
      <button id="appleMapsButton" type="button" disabled>Apple Maps</button>
      <button id="clearButton" type="button">クリア</button>
    </nav>

    <div id="goalOverlay" class="goal-overlay" aria-live="assertive" aria-hidden="true">
      <div class="goal-message">
        <div class="goal-burst">🎉</div>
        <div class="goal-title">ゴール！</div>
        <div class="goal-subtitle">目的地に到着しました</div>
      </div>
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
